# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App

on:
  push:
    branches:
      - master
      - development # 1. Added to listen to changes on the development branch
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy-to-development:
    runs-on: windows-latest
    needs: build
    # 2. This job ONLY runs if the push happened on the 'development' branch
    if: github.ref == 'refs/heads/development'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F4F86074DE24C56A0E88C0244199848 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_576395801F9A43F383F3C6F8EC361F3E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_214FC103E7DF4D91B84BA3E853BB0C09 }}

      - name: Deploy to Azure Web App (Development Slot)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lottolytic-prog-app'
          slot-name: 'development' # 3. Targets your development slot specifically
          package: .

  deploy-to-production:
    runs-on: windows-latest
    needs: build
    # 4. This job ONLY runs if the push happened on the 'master' branch
    if: github.ref == 'refs/heads/master'
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_8F4F86074DE24C56A0E88C0244199848 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_576395801F9A43F383F3C6F8EC361F3E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_214FC103E7DF4D91B84BA3E853BB0C09 }}

      - name: Deploy to Azure Web App (Production Slot)
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'lottolytic-prog-app'
          slot-name: 'Production'
          package: .